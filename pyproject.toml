[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zvonko-family-assistant"
version = "0.1.0"
description = "Private Croatian phone-based family reminder assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "langgraph>=0.2,<2",
  "phonenumbers>=8.13,<10",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24,<26",
  "httpx>=0.28,<1",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
zvonko = "app.dev_cli:main"
zvonko-eval = "evals.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests", "evals"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["app/db/migrations"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["arq.*", "phonenumbers.*"]
ignore_missing_imports = true
